[package]
name = "alex"
version = "0.1.0"
edition = "2021"
description = "Alex – hòn đảo nổi nhẹ cho Windows"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
ureq = { version = "2.12", features = ["json"] }
lopdf = { version = "0.47", default-features = false }
pdf-writer = "0.15"
ttf-parser = "0.25"
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
windows = { version = "0.62", features = [
  "Foundation", "Media_Control", "Data_Pdf", "Graphics_Imaging", "Storage", "Storage_Streams", "Foundation_Collections",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_System_Registry", "Win32_System_Threading", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_System_Com",
  "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Cryptography",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
